{% extends 'base.html' %}{% block content %}
<h1>تعديل السداد</h1>
<form method="post" class="panel grid-form" data-edit-split-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="wide">حساب المورد<select name="supplier_account_id" id="supplierAccount" required>{% for a in supplier_accounts %}<option value="{{a.id}}" data-location="{{a.location_id}}" {% if row.supplier_account_id==a.id %}selected{% endif %}>{{a.supplier_name}} — {{a.location_name}}</option>{% endfor %}</select></label>
<input type="hidden" name="branch_id" id="locationId" value="{{ row.branch_id }}">
<label>القيمة<input type="number" step="0.01" min="0.01" name="amount" value="{{ row.amount }}" required></label>
<label>التاريخ<input type="date" name="payment_date" value="{{ row.payment_date }}" required></label>
<div class="wide split-box"><h3>تقسيم السداد على الحسابات المالية</h3><div class="split-rows"></div><button type="button" class="secondary add-split">+ إضافة حساب آخر</button><p class="split-summary">المجموع: <strong class="split-total">0.00</strong> — المتبقي: <strong class="split-remaining">0.00</strong></p></div>
<label class="wide">ملاحظات<input name="notes" value="{{ row.notes or '' }}"></label><button>حفظ التعديل</button><a class="button-link" href="{{ url_for('payments') }}">إلغاء</a>
</form>
<script id="account-data" type="application/json">[{% for a in accounts %}{"id":{{a.id}},"branch_id":{{a.branch_id}},"name":{{a.name|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}]</script>
<script id="current-splits" type="application/json">[{% for s in current_splits %}{"account_id":{{s.account_id}},"amount":{{s.amount}}}{% if not loop.last %},{% endif %}{% endfor %}]</script>
<script>const supplierSelect=document.getElementById('supplierAccount'),locationInput=document.getElementById('locationId');function syncLocation(){locationInput.value=supplierSelect.selectedOptions[0]?.dataset.location||'';document.querySelector('select[name="branch_id"]')?.dispatchEvent(new Event('change'));}supplierSelect?.addEventListener('change',syncLocation);syncLocation();</script>
{% include '_edit_split_script.html' %}
{% endblock %}
