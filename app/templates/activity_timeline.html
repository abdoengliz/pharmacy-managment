{% extends 'base.html' %}{% block content %}<h1>الخط الزمني</h1><p class="muted">{{entity_type}} #{{entity_id}}</p><div class="card">{% for r in rows %}<div style="border-right:3px solid var(--primary);padding:10px 16px;margin:10px 0"><strong>{{r.title}}</strong><div>{{r.description or ''}}</div><small>{{r.created_at}} · {{r.user_name}} · {{r.branch_name}}</small></div>{% else %}<p>لا توجد أحداث لهذا المستند.</p>{% endfor %}</div>{% endblock %}
