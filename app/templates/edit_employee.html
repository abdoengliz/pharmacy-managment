{% extends 'base.html' %}{% block title %}تعديل موظف{% endblock %}{% block content %}
<div class="page-head"><div><h1>تعديل بيانات الموظف</h1><p>{{ row.full_name }} — {{ row.employee_no }}</p></div><a class="btn secondary" href="{{ url_for('employee_detail', employee_id=row.id) }}">إلغاء</a></div>
<form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>الرقم الوظيفي<input name="employee_no" value="{{ row.employee_no }}" required></label><label>كود الموظف<input name="employee_code" value="{{ row.employee_code or '' }}"></label>
<label>الاسم الكامل<input name="full_name" value="{{ row.full_name }}" required></label><label>رقم الهاتف<input name="phone" value="{{ row.phone or '' }}"></label>
<label>الفرع<select name="branch_id"><option value="">بدون فرع</option>{% for b in branches %}<option value="{{ b.id }}" {{ 'selected' if row.branch_id==b.id else '' }}>{{ b.name }}</option>{% endfor %}</select></label>
<label>القسم<select name="department"><option value="">بدون قسم</option>{% for d in departments %}<option value="{{ d.name }}" {{ 'selected' if row.department==d.name else '' }}>{{ d.name }}</option>{% endfor %}</select></label>
<label>المسمى الوظيفي<select name="job_title"><option value="">بدون وظيفة</option>{% for j in jobs %}<option value="{{ j.name }}" {{ 'selected' if row.job_title==j.name else '' }}>{{ j.name }}</option>{% endfor %}</select></label><label>المدير المباشر<input name="direct_manager" value="{{ row.direct_manager or '' }}"></label>
<label>تاريخ التعيين<input type="date" name="hire_date" value="{{ row.hire_date }}" required></label><label>تاريخ مباشرة العمل<input type="date" name="work_start_date" value="{{ row.work_start_date or row.hire_date }}"></label>
<label>نوع العقد<select name="contract_type"><option value="permanent" {{ 'selected' if row.contract_type=='permanent' else '' }}>دائم</option><option value="temporary" {{ 'selected' if row.contract_type=='temporary' else '' }}>مؤقت</option><option value="part_time" {{ 'selected' if row.contract_type=='part_time' else '' }}>دوام جزئي</option><option value="training" {{ 'selected' if row.contract_type=='training' else '' }}>تدريب</option></select></label>
<label>حالة الموظف<select name="employment_status"><option value="active" {{ 'selected' if row.employment_status=='active' else '' }}>على رأس العمل</option><option value="leave" {{ 'selected' if row.employment_status=='leave' else '' }}>في إجازة</option><option value="suspended" {{ 'selected' if row.employment_status=='suspended' else '' }}>موقوف</option><option value="resigned" {{ 'selected' if row.employment_status=='resigned' else '' }}>مستقيل</option></select></label>
<label>نوع الدوام<select name="shift_type"><option value="full" {{ 'selected' if row.shift_type=='full' else '' }}>كامل</option><option value="morning" {{ 'selected' if row.shift_type=='morning' else '' }}>صباحي</option><option value="evening" {{ 'selected' if row.shift_type=='evening' else '' }}>مسائي</option><option value="flexible" {{ 'selected' if row.shift_type=='flexible' else '' }}>مرن</option></select></label>
<label>ساعات العمل اليومية<input type="number" step="0.5" min="0" max="24" name="daily_hours" value="{{ row.daily_hours or 8 }}"></label>
<label class="wide">أيام العمل الأسبوعية<input name="work_days" value="{{ row.work_days or '' }}"></label>
<label>رقم جهاز البصمة<input name="biometric_no" value="{{ row.biometric_no or '' }}"></label><label>رمز الحضور الجديد<input type="password" name="attendance_pin" inputmode="numeric" pattern="[0-9]{4,8}" placeholder="اتركه فارغًا للإبقاء على الرمز الحالي"></label><label class="checkbox-label"><input type="checkbox" name="attendance_portal_enabled" value="1" {{ 'checked' if row.attendance_portal_enabled else '' }}> تفعيل بوابة الحضور لهذا الموظف</label><label>الراتب الأساسي<input type="number" step="0.01" min="0" name="basic_salary" value="{{ row.basic_salary }}"></label>
<label>البدلات الثابتة<input type="number" step="0.01" min="0" name="fixed_allowances" value="{{ row.fixed_allowances or 0 }}"></label><label>الخصومات الثابتة<input type="number" step="0.01" min="0" name="fixed_deductions" value="{{ row.fixed_deductions or 0 }}"></label>
<label>اسم البنك<input name="bank_name" value="{{ row.bank_name or '' }}"></label><label>رقم الحساب البنكي<input name="bank_account" value="{{ row.bank_account or '' }}"></label>
<label>جهة اتصال للطوارئ<input name="emergency_contact_name" value="{{ row.emergency_contact_name or '' }}"></label><label>هاتف الطوارئ<input name="emergency_contact_phone" value="{{ row.emergency_contact_phone or '' }}"></label>
<label class="wide">العنوان<input name="address" value="{{ row.address or '' }}"></label><label class="wide">ملاحظات<textarea name="notes" rows="4">{{ row.notes or '' }}</textarea></label>
<button class="wide">حفظ التعديلات</button>
</form>{% endblock %}
