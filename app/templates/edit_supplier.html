{% extends 'base.html' %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">إدارة الموردين</p><h1>تعديل المورد</h1><p>{{row.supplier_code}}</p></div></div>
<form method="post" class="panel grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>اسم المورد<input name="name" value="{{ row.name }}" required></label><label>اسم المندوب<input name="representative_name" value="{{ row.representative_name or '' }}"></label><label>الهاتف<input name="phone" value="{{ row.phone or '' }}"></label>
<label>تصنيف المورد<select name="category">{% for c in ['أدوية','مستحضرات تجميل','أجهزة','مستلزمات','مختبرات','أغذية أطفال','أخرى'] %}<option {% if row.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label>
<label>تقييم المورد<select name="rating">{% for n in range(1,6) %}<option value="{{n}}" {% if row.rating==n %}selected{% endif %}>{{'★'*n}}{{'☆'*(5-n)}}</option>{% endfor %}</select></label>
<label>أيام السماح<input type="number" min="0" name="grace_days" value="{{row.grace_days or 0}}"></label><label>حد الائتمان<input type="number" min="0" step="0.01" name="credit_limit" value="{{row.credit_limit or 0}}"></label>
<fieldset class="wide"><legend>طرق الدفع المقبولة</legend>{% for m in ['نقدي','تحويل','صك','شبكة'] %}<label style="display:inline-flex;margin-left:15px"><input type="checkbox" name="payment_methods" value="{{m}}" {% if m in (row.payment_methods or '') %}checked{% endif %}> {{m}}</label>{% endfor %}</fieldset>
<label class="wide">ملاحظات عامة<input name="notes" value="{{ row.notes or '' }}"></label><label class="wide">ملاحظات داخلية<textarea name="internal_notes">{{row.internal_notes or ''}}</textarea></label>
<button>حفظ التعديل</button><a class="button-link" href="{{ url_for('supplier_detail',supplier_id=row.id) }}">إلغاء</a>
</form>{% endblock %}
