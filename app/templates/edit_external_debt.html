{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>تعديل {{debt.reference_no}}</h1><p>المسدد حاليًا: {{'%.2f'|format(paid)}}</p></div></div><form class="card form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label>نوع الدين</label><select name="debt_type">{% for k,v in debt_types.items() %}<option value="{{k}}" {% if debt.debt_type==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div><div><label>اسم الجهة</label><input name="party_name" value="{{debt.party_name}}" required></div><div><label>نوع الجهة</label><select name="party_type">{% for k,v in party_types.items() %}<option value="{{k}}" {% if debt.party_type==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div><div><label>الهاتف</label><input name="phone" value="{{debt.phone or ''}}"></div><div><label>الموقع</label><select name="branch_id" id="editDebtBranch">{% for b in branches %}<option value="{{b.id}}" {% if debt.branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></div><div><label>الحساب</label><select name="account_id" id="editDebtAccount">{% for a in accounts %}<option value="{{a.id}}" data-branch="{{a.branch_id}}" {% if debt.account_id==a.id %}selected{% endif %}>{{a.name}}</option>{% endfor %}</select></div><div><label>المبلغ</label><input type="number" step="0.01" min="{{paid}}" name="amount" value="{{debt.amount}}" required></div><div><label>تاريخ الدين</label><input type="date" name="debt_date" value="{{debt.debt_date}}" required></div><div><label>الاستحقاق</label><input type="date" name="due_date" value="{{debt.due_date or ''}}"></div><div><label>السبب</label><select name="reason_type">{% for k,v in reason_types.items() %}<option value="{{k}}" {% if debt.reason_type==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div><div><label>تفاصيل السبب</label><input name="reason_details" value="{{debt.reason_details or ''}}"></div><div><label>ملاحظات</label><input name="notes" value="{{debt.notes or ''}}"></div><div class="form-actions"><button class="btn primary">حفظ التعديل</button></div></form><script>const br=document.getElementById('editDebtBranch'),ac=document.getElementById('editDebtAccount');function f(){[...ac.options].forEach(o=>o.hidden=o.dataset.branch!==br.value);if(ac.selectedOptions[0]?.hidden)ac.value=[...ac.options].find(o=>!o.hidden)?.value||''}br.addEventListener('change',f);f();</script>{% endblock %}
