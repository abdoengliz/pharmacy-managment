{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">فاتورة مورد</p><h1>تعديل الفاتورة {{row.invoice_number}}</h1><p>{{row.supplier_name}} · {{row.location_name}}</p></div></div><form method="post" class="panel grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>رقم الفاتورة<input name="invoice_number" value="{{row.invoice_number}}" required></label><label>تاريخ الفاتورة<input type="date" name="invoice_date" value="{{row.invoice_date}}" required></label><label>قيمة الفاتورة<input type="number" min="0.01" step="0.01" name="amount" value="{{row.amount}}" required></label><label class="wide">ملاحظات<input name="notes" value="{{row.notes or ''}}"></label><button>حفظ التعديل</button><a class="button-link" href="{{url_for('supplier_detail',supplier_id=row.supplier_id)}}">إلغاء</a></form>{% endblock %}
