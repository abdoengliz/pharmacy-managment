{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>تعديل الدور</h1><p>{{ row.code }}</p></div><a class="button-link" href="{{ url_for('roles_page') }}">رجوع</a></div><form method="post" class="panel grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>اسم الدور<input name="name" value="{{ row.name }}" required></label><label>الحالة<select name="is_active"><option value="1" {{ 'selected' if row.is_active else '' }}>نشط</option><option value="0" {{ 'selected' if not row.is_active else '' }}>موقوف</option></select></label><label class="wide">الوصف<input name="description" value="{{ row.description or '' }}"></label><div class="wide permissions">{% for key,label in permissions_map.items() %}<label><input type="checkbox" name="permissions" value="{{ key }}" {{ 'checked' if key in selected_permissions else '' }}> {{ label }}</label>{% endfor %}</div><button>حفظ التعديلات</button></form>{% endblock %}
