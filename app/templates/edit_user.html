{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>تعديل المستخدم</h1><p>الحساب والموظف والدور والصلاحيات.</p></div><a class="button-link" href="{{ url_for('users') }}">رجوع</a></div><form method="post" class="panel grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>الاسم الكامل<input name="full_name" value="{{ row.full_name }}" required></label><label>اسم المستخدم<input name="username" value="{{ row.username }}" required></label><label>كلمة مرور جديدة<input type="password" name="password" placeholder="اتركها فارغة"></label><label>نوع الحساب<select name="role"><option value="user" {{ 'selected' if row.role=='user' else '' }}>مستخدم</option>{% if current_user.role=='admin' %}<option value="admin" {{ 'selected' if row.role=='admin' else '' }}>مدير نظام</option>{% endif %}</select></label><label>الموظف المرتبط<select name="employee_id"><option value="">بدون ربط</option>{% for e in employees %}<option value="{{ e.id }}" {{ 'selected' if row.employee_id==e.id else '' }}>{{ e.employee_no }} - {{ e.full_name }}</option>{% endfor %}</select></label><label>الدور الوظيفي<select name="role_id"><option value="">صلاحيات مخصصة</option>{% for r in roles %}<option value="{{ r.id }}" {{ 'selected' if row.role_id==r.id else '' }}>{{ r.name }}</option>{% endfor %}</select></label><label>الموقع<select name="branch_id"><option value="">كل المواقع</option>{% for b in branches %}<option value="{{ b.id }}" {{ 'selected' if row.branch_id==b.id else '' }}>{{ b.name }}</option>{% endfor %}</select></label><label>الحالة<select name="is_active"><option value="1" {{ 'selected' if row.is_active else '' }}>نشط</option><option value="0" {{ 'selected' if not row.is_active else '' }}>موقوف</option></select></label><div class="wide permissions"><strong>صلاحيات إضافية مخصصة</strong>{% for key,label in permissions_map.items() %}<label><input type="checkbox" name="permissions" value="{{ key }}" {{ 'checked' if key in selected_permissions else '' }}> {{ label }}</label>{% endfor %}</div><button>حفظ التعديلات</button></form>{% endblock %}
