<script>
(() => {
  const form=document.querySelector('[data-edit-split-form]'); if(!form) return;
  const totalInput=form.querySelector('input[name="amount"]');
  const branchSelect=form.querySelector('select[name="branch_id"]');
  const locationInput=form.querySelector('input[name="branch_id"]');
  const rows=form.querySelector('.split-rows');
  const accounts=JSON.parse(document.getElementById('account-data').textContent||'[]');
  const current=JSON.parse(document.getElementById('current-splits').textContent||'[]');
  const branchId=()=>Number(branchSelect?branchSelect.value:locationInput?.value||0);
  function fill(select,selected){select.innerHTML=accounts.filter(a=>a.branch_id===branchId()).map(a=>`<option value="${a.id}" ${Number(selected)===a.id?'selected':''}>${a.name}</option>`).join('');}
  function update(){const total=Number(totalInput.value||0),used=[...rows.querySelectorAll('input[name="split_amount"]')].reduce((s,i)=>s+Number(i.value||0),0);form.querySelector('.split-total').textContent=used.toFixed(2);form.querySelector('.split-remaining').textContent=(total-used).toFixed(2);}
  function addRow(accountId='',amount=''){const row=document.createElement('div');row.className='split-row';row.innerHTML='<select name="split_account_id" required></select><input name="split_amount" type="number" min="0.01" step="0.01" required><button type="button" class="danger-button">إزالة</button>';rows.appendChild(row);fill(row.querySelector('select'),accountId);row.querySelector('input').value=amount;row.querySelector('input').addEventListener('input',update);row.querySelector('button').onclick=()=>{if(rows.children.length>1){row.remove();update();}};}
  form.querySelector('.add-split').onclick=()=>addRow();
  if(branchSelect) branchSelect.addEventListener('change',()=>rows.querySelectorAll('select').forEach(s=>fill(s,s.value)));
  if(locationInput){new MutationObserver(()=>rows.querySelectorAll('select').forEach(s=>fill(s,s.value))).observe(locationInput,{attributes:true,attributeFilter:['value']});document.getElementById('supplierAccount')?.addEventListener('change',()=>setTimeout(()=>rows.querySelectorAll('select').forEach(s=>fill(s,'')),0));}
  totalInput.addEventListener('input',update);
  (current.length?current:[{account_id:'',amount:totalInput.value}]).forEach(s=>addRow(s.account_id,s.amount)); update();
  form.addEventListener('submit',e=>{const total=Number(totalInput.value||0),used=[...rows.querySelectorAll('input[name="split_amount"]')].reduce((s,i)=>s+Number(i.value||0),0);if(Math.abs(total-used)>.009){e.preventDefault();alert('مجموع تقسيم الحسابات لازم يساوي قيمة العملية.');}});
})();
</script>
